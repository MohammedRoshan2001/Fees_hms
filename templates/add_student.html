{% extends "base.html" %}

{% block content %}
{% load static %}
<style>
    ul{
        list-style-type: none;
    }
    input, label {
        display:block;
    }
</style>

	<form class="shadow border rounded p-4 bg-light" name="createform" onsubmit="return validateForm()" method = "post" enctype="multipart/form-data">
        <div class="fs-3">Add Student</div>
        <br>
  
  	{% csrf_token %}
         
    <div class="mb-3">
        <label class="form-label" for="usn">Enter Reg No</label>
        <input list="usn" name="usn" class="form-control" required>
        <datalist id="usn">
            {% for i in student_list %}
                <option value="{{i.roll_no2}}">
            {% endfor %}
        </datalist> 
    </div>

    <div class="mb-3">
      <label for="exampleFormControlSelect1">Enter Year</label>
      <select class="form-control" name="year" id='YearSelect'>
        <option value="---">---</option>
        <option value="0">dummy</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
      </select>
    </div>
    <div class="mb-3">
      <label for="exampleFormControlSelect1">Enter Academic Year</label>
      <select class="form-control" name="academic_year" id='academicYearSelect'>
        <option value="---">---</option>
        {% for i in year_list %}
        <option value="{{i.academic_year}}">{{i.academic_year}}</option>
        {% endfor %}
      </select>
      
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" value="1" name="repeater">
      <label class="form-check-label" for="flexCheckDefault">
        Repeater ?
      </label>
    </div>
		<button type="submit" class="btn btn-primary" onclick="validateForm()">Submit</button>
	</form>

  <script>
    function validateForm() {
        var academicYearSelect = document.getElementById('academicYearSelect');
        if (academicYearSelect.value === '---') {
          alert('Please select a valid Academic Year');
          event.preventDefault(); // Prevent form submission
        }
      var academicYearSelect = document.getElementById('YearSelect');
      if (academicYearSelect.value === '---') {
        alert('Please select a valid Year');
        event.preventDefault(); // Prevent form submission
      }
    }
    
  </script>
{% endblock %}
